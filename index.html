document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

k.onToggle }}\" style=\"width:11px;height:11px;border-radius:50%;flex-shrink:0;cursor:pointer;border:1.5px solid {{ task.checkboxBorder }};background:{{ task.checkboxBg }};\"><\u002Fspan>\n                  <span style=\"font-size:{{ task.titleFontSize }};font-weight:{{ task.titleWeight }};color:{{ task.textColor }};text-decoration:{{ task.doneDecoration }};flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ task.title }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"padding:3px 5px 6px;\">\n              <button sc-camel-on-click=\"{{ day.onAdd }}\" style=\"width:100%;font-family:'Petrona',serif;font-size:13px;color:#B4AFA0;border:none;background:none;padding:2px 0;\">+<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isStatsView }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:18px 4px;\">\n        <div style=\"font-family:'Courier New',monospace;font-size:10px;color:#9AA0A8;letter-spacing:0.07em;margin-bottom:16px;\">COMPLETION — LAST 8 WEEKS<\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-end;gap:12px;height:150px;\">\n          <sc-for list=\"{{ statsWeeks }}\" as=\"w\" hint-placeholder-count=\"8\">\n            <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;\">\n              <span style=\"font-family:'Courier New',monospace;font-size:10px;color:{{ w.labelColor }};\">{{ w.pct }}%<\u002Fspan>\n              <div style=\"width:100%;max-width:26px;height:{{ w.barHeight }}px;background:{{ w.barColor }};border-radius:6px 6px 0 0;\"><\u002Fdiv>\n              <span style=\"font-family:'Courier New',monospace;font-size:10px;color:{{ w.labelColor }};\">{{ w.label }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:6px 4px 18px;\">\n        <div style=\"font-family:'Courier New',monospace;font-size:10px;color:#9AA0A8;letter-spacing:0.07em;margin-bottom:16px;\">THIS WEEK BY PROJECT<\u002Fdiv>\n        <div style=\"display:flex;gap:20px;flex-wrap:wrap;\">\n          <sc-for list=\"{{ categoryStats }}\" as=\"cat\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;flex-direction:column;gap:4px;min-width:80px;\">\n              <div style=\"display:flex;align-items:baseline;gap:5px;\">\n                <span style=\"font-size:13px;font-weight:600;color:{{ cat.color }};\">{{ cat.name }}<\u002Fspan>\n                <span style=\"font-family:'Courier New',monospace;font-size:10px;color:#9AA0A8;\">{{ cat.done }}/{{ cat.total }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:3px;border-radius:2px;background:#D2D4CA;\">\n                <div style=\"height:100%;width:{{ cat.pct }}%;background:{{ cat.color }};border-radius:2px;transition:width 0.3s;\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#54677A&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#54677A&quot;,&quot;#8A6247&quot;,&quot;#5F7A5E&quot;,&quot;#8C6E8A&quot;]},&quot;defaultView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;list&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;list&quot;,&quot;calendar&quot;,&quot;stats&quot;]},&quot;showReminderBanner&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nconst DAYS = [\"Monday\",\"Tuesday\",\"Wednesday\",\"Thursday\",\"Friday\",\"Saturday\",\"Sunday\"];\nconst PROJECTS = [\"—\",\"Jakob\",\"Situations\",\"Legal\",\"Events\",\"AntonPaar\",\"Razpisi\"];\nconst PROJECT_COLORS = { Jakob: \"#54677A\", Situations: \"#8A6247\", Legal: \"#5F7A5E\", Events: \"#8C6E8A\", AntonPaar: \"#9C8A4A\", Razpisi: \"#7A6A54\" };\nconst STORAGE_KEY = \"weekly_tracker_dc_v1\";\n\nfunction getMonday(d) { const date = new Date(d); const day = date.getDay(); date.setDate(date.getDate() + (day === 0 ? -6 : 1 - day)); date.setHours(0,0,0,0); return date; }\nfunction addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }\nfunction fmt(d) { return d.toLocaleDateString(\"en-GB\", { day: \"numeric\", month: \"short\" }); }\nfunction dateKey(d) { const y = d.getFullYear(); const m = String(d.getMonth()+1).padStart(2,\"0\"); const day = String(d.getDate()).padStart(2,\"0\"); return y + \"-\" + m + \"-\" + day; }\nfunction todayKey() { return dateKey(new Date()); }\nlet _id = Date.now();\nfunction uid() { return String(++_id); }\n\nclass Component extends DCLogic {\n  state = {\n    tasks: this.loadTasks(),\n    weekStart: getMonday(new Date()).getTime(),\n    view: (this.props && this.props.defaultView) || \"list\",\n    modal: null,\n    form: {},\n    dragOverKey: null,\n    draggingId: null,\n    search: \"\",\n    filterProject: \"All\",\n    filterPriority: \"All\",\n    filterStatus: \"all\",\n    newCommentText: \"\"\n  };\n\n  loadTasks() {\n    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch (e) { return []; }\n  }\n  componentDidUpdate(prevProps, prevState) {\n    if (prevState.tasks !== this.state.tasks) {\n      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state.tasks)); } catch (e) {}\n    }\n  }\n\n  setView = (v) => this.setState({ view: v });\n  prevWeek = () => this.setState(s => ({ weekStart: addDays(new Date(s.weekStart), -7).getTime() }));\n  nextWeek = () => this.setState(s => ({ weekStart: addDays(new Date(s.weekStart), 7).getTime() }));\n  goToday = () => this.setState({ weekStart: getMonday(new Date()).getTime() });\n\n  setSearch = (v) => this.setState({ search: v });\n  setFilterProject = (v) => this.setState({ filterProject: v });\n  setFilterPriority = (v) => this.setState({ filterPriority: v });\n  setFilterStatus = (v) => this.setState({ filterStatus: v });\n\n  openAdd = (dateStr) => this.setState({ modal: \"add\", form: { title: \"\", description: \"\", priority: \"medium\", status: \"to-do\", project: \"—\", date: dateStr, due: \"\", forPerson: \"\", comments: [], subtasks: [] }, newCommentText: \"\", newSubtaskText: \"\" });\n  openEdit = (task) => this.setState({ modal: \"edit\", form: { ...task, comments: (task.comments || []).slice(), subtasks: (task.subtasks || []).slice() }, newCommentText: \"\", newSubtaskText: \"\" });\n  closeModal = () => this.setState({ modal: null });\n  stopProp = (e) => e.stopPropagation();\n\n  setFormField = (key, val) => this.setState(s => ({ form: { ...s.form, [key]: val } }));\n\n  setNewCommentText = (v) => this.setState({ newCommentText: v });\n  addComment = () => {\n    const text = this.state.newCommentText.trim();\n    if (!text) return;\n    this.setState(s => ({\n      form: { ...s.form, comments: [...(s.form.comments || []), { id: uid(), text, ts: new Date().toISOString() }] },\n      newCommentText: \"\"\n    }));\n  };\n  deleteComment = (id) => this.setState(s => ({ form: { ...s.form, comments: (s.form.comments || []).filter(c => c.id !== id) } }));\n\n  setNewSubtaskText = (v) => this.setState({ newSubtaskText: v });\n  addSubtask = () => {\n    const text = (this.state.newSubtaskText || \"\").trim();\n    if (!text) return;\n    this.setState(s => ({\n      form: { ...s.form, subtasks: [...(s.form.subtasks || []), { id: uid(), text, done: false }] },\n      newSubtaskText: \"\"\n    }));\n  };\n  toggleSubtask = (id) => this.setState(s => ({ form: { ...s.form, subtasks: (s.form.subtasks || []).map(m => m.id === id ? { ...m, done: !m.done } : m) } }));\n  deleteSubtask = (id) => this.setState(s => ({ form: { ...s.form, subtasks: (s.form.subtasks || []).filter(m => m.id !== id) } }));\n\n  saveTask = () => {\n    const form = this.state.form;\n    if (!form.title || !form.title.trim()) return;\n    if (this.state.modal === \"add\") {\n      this.setState(s => ({ tasks: [...s.tasks, { ...form, id: uid() }], modal: null }));\n    } else {\n      this.setState(s => ({ tasks: s.tasks.map(t => t.id === form.id ? { ...form } : t), modal: null }));\n    }\n  };\n  deleteTask = () => {\n    const id = this.state.form.id;\n    this.setState(s => ({ tasks: s.tasks.filter(t => t.id !== id), modal: null }));\n  };\n  toggleDone = (id) => this.setState(s => ({ tasks: s.tasks.map(t => t.id === id ? { ...t, status: t.status === \"done\" ? \"to-do\" : \"done\" } : t) }));\n\n  onDragStartTask = (task) => this.setState({ draggingId: task.id });\n  onDragOverDay = (e, key) => { e.preventDefault(); this.setState({ dragOverKey: key }); };\n  onDropDay = (e, key) => {\n    e.preventDefault();\n    const id = this.state.draggingId;\n    if (id) this.setState(s => ({ tasks: s.tasks.map(t => t.id === id ? { ...t, date: key } : t), draggingId: null, dragOverKey: null }));\n    else this.setState({ draggingId: null, dragOverKey: null });\n  };\n\n  matchesFilters(t) {\n    const s = this.state;\n    const q = s.search.trim().toLowerCase();\n    if (q && !(t.title.toLowerCase().includes(q) || (t.forPerson || \"\").toLowerCase().includes(q))) return false;\n    if (s.filterProject !== \"All\" && t.project !== s.filterProject) return false;\n    if (s.filterPriority !== \"All\" && t.priority !== s.filterPriority) return false;\n    if (s.filterStatus === \"active\" && t.status === \"done\") return false;\n    if (s.filterStatus === \"done\" && t.status !== \"done\") return false;\n    return true;\n  }\n\n  buildChip(task, compact) {\n    const done = task.status === \"done\";\n    const today = todayKey();\n    let dueLabel = null, dueColor = null;\n    if (task.due && !done) {\n      if (task.due < today) { dueLabel = \"overdue\"; dueColor = \"#9A5A3E\"; }\n      else if (task.due === today) { dueLabel = \"due today\"; dueColor = \"#8A6247\"; }\n      else { dueLabel = fmt(new Date(task.due)); dueColor = \"#9AA0A8\"; }\n    }\n    return {\n      id: task.id,\n      title: task.title,\n      done,\n      cardBg: done ? \"#F5F1E8\" : \"#FFFFFF\",\n      shadow: done ? \"none\" : \"0 3px 12px rgba(37,42,48,.06)\",\n      checkboxBorder: task.priority === \"high\" ? \"#54677A\" : \"#9AA0A8\",\n      checkboxBg: done ? \"#54677A\" : \"transparent\",\n      textColor: done ? \"#B4AFA0\" : \"#252A30\",\n      titleWeight: task.priority === \"high\" ? \"600\" : \"400\",\n      doneDecoration: done ? \"line-through\" : \"none\",\n      project: (!compact && task.project && task.project !== \"—\") ? task.project : null,\n      projectColor: PROJECT_COLORS[task.project] || \"#9AA0A8\",\n      forPerson: (!compact && task.forPerson) ? task.forPerson : null,\n      dueLabel, dueColor,\n      padding: compact ? \"3px 6px\" : \"9px 12px\",\n      titleFontSize: compact ? \"11px\" : \"14px\",\n      onClick: () => this.openEdit(task),\n      onToggle: (e) => { e.stopPropagation(); this.toggleDone(task.id); },\n      onDragStart: (e) => { e.dataTransfer.effectAllowed = \"move\"; this.onDragStartTask(task); }\n    };\n  }\n\n  renderVals() {\n    const s = this.state;\n    const accentColor = (this.props && this.props.accentColor) || \"#54677A\";\n    const weekStart = new Date(s.weekStart);\n    const weekDaysDates = DAYS.map((_, i) => addDays(weekStart, i));\n    const tk = todayKey();\n    const weekKeys = new Set(weekDaysDates.map(d => dateKey(d)));\n\n    const weekTasksAll = s.tasks.filter(t => weekKeys.has(t.date));\n    const weekDone = weekTasksAll.filter(t => t.status === \"done\").length;\n    const weekTotal = weekTasksAll.length;\n    const weekPct = weekTotal > 0 ? Math.round((weekDone / weekTotal) * 100) : 0;\n\n    const showReminder = this.props && this.props.showReminderBanner !== false;\n    const overdueCount = s.tasks.filter(t => t.status !== \"done\" && t.due && t.due < tk).length;\n    const dueTodayCount = s.tasks.filter(t => t.status !== \"done\" && t.due === tk).length;\n    let reminderText = null;\n    if (showReminder && (overdueCount > 0 || dueTodayCount > 0)) {\n      const parts = [];\n      if (overdueCount > 0) parts.push(overdueCount + (overdueCount === 1 ? \" task overdue\" : \" tasks overdue\"));\n      if (dueTodayCount > 0) parts.push(dueTodayCount + \" due today\");\n      reminderText = parts.join(\" · \");\n    }\n\n    const days = weekDaysDates.map((day, i) => {\n      const key = dateKey(day);\n      const isToday = key === tk;\n      const isDragOver = s.dragOverKey === key;\n      const dayTasks = s.tasks.filter(t => t.date === key && this.matchesFilters(t));\n      const hasTasks = dayTasks.length > 0;\n      return {\n        key,\n        dayName: DAYS[i],\n        dayShort: DAYS[i].slice(0, 3).toUpperCase(),\n        dateLabel: fmt(day),\n        isToday,\n        hasTasks,\n        showEmpty: !hasTasks,\n        tasks: dayTasks.map(t => this.buildChip(t, false)),\n        dropBg: isDragOver ? \"#E4E9EC\" : \"transparent\",\n        dropPadding: isDragOver ? \"6px\" : \"0px\",\n        nameColor: isToday ? \"#252A30\" : \"#3B4046\",\n        railOpacity: isToday ? \"1\" : (hasTasks ? \"0.85\" : \"0.35\"),\n        railColor: isToday ? \"#252A30\" : \"#9AA0A8\",\n        railWeight: isToday ? \"600\" : \"400\",\n        dotSize: isToday ? \"8px\" : \"6px\",\n        dotColor: isToday ? accentColor : \"#9AA0A8\",\n        onDragOver: (e) => this.onDragOverDay(e, key),\n        onDrop: (e) => this.onDropDay(e, key),\n        onAdd: () => this.openAdd(key)\n      };\n    });\n\n    const calendarDays = weekDaysDates.map((day, i) => {\n      const key = dateKey(day);\n      const isToday = key === tk;\n      const isDragOver = s.dragOverKey === key;\n      const    const subtasksRaw = form.subtasks || [];\n    const subtaskTotal = subtasksRaw.length;\n    const subtaskDone = subtasksRaw.filter(m => m.done).length;\n    const subtaskPct = subtaskTotal > 0 ? Math.round((subtaskDone / subtaskTotal) * 100) : 0;\n    const subtasks = subtasksRaw.map(m => ({\n      id: m.id, text: m.text, done: m.done,\n      textDecoration: m.done ? \"line-through\" : \"none\",\n      textColor: m.done ? \"#B4AFA0\" : \"#252A30\",\n      checkboxBorder: m.done ? accentColor : \"#9AA0A8\",\n      checkboxBg: m.done ? accentColor : \"transparent\",\n      onToggle: () => this.toggleSubtask(m.id),\n      onDelete: () => this.deleteSubtask(m.id)\n    }));\n\n    const mkTab = (key, label) => ({\n      key, label,\n      onClick: () => this.setView(key),\n      color: s.view === key ? accentColor : \"#9AA0A8\",\n      border: s.view === key ? \"2px solid \" + accentColor : \"2px solid transparent\"\n    });\n    const tabs = [mkTab(\"list\", \"LIST\"), mkTab(\"calendar\", \"CAL\"), mkTab(\"stats\", \"STATS\")];\n\n    const mkStatusTab = (key, label) => ({\n      key, label,\n      onClick: () => this.setFilterStatus(key),\n      color: s.filterStatus === key ? \"#252A30\" : \"#9AA0A8\",\n      border: s.filterStatus === key ? \"1px solid #252A30\" : \"1px solid transparent\"\n    });\n    const statusTabs = [mkStatusTab(\"all\", \"ALL\"), mkStatusTab(\"active\", \"ACTIVE\"), mkStatusTab(\"done\", \"DONE\")];\n\n    return {\n      weekLabel: fmt(weekStart) + \" – \" + fmt(addDays(weekStart, 6)),\n      prevWeek: this.prevWeek, nextWeek: this.nextWeek, goToday: this.goToday,\n      isListView: s.view === \"list\", isCalendarView: s.view === \"calendar\", isStatsView: s.view === \"stats\",\n      tabs, statusTabs,\n      search: s.search, setSearch: (e) => this.setSearch(e.target.value),\n      filterProject: s.filterProject, setFilterProject: (e) => this.setFilterProject(e.target.value),\n      filterPriority: s.filterPriority, setFilterPriority: (e) => this.setFilterPriority(e.target.value),\n      projectOptions: PROJECTS.filter(p => p !== \"—\"),\n      accentColor,\n      weekPct,\n      weekPctLabel: weekTotal > 0 ? (weekDone + \"/\" + weekTotal + \" · \" + weekPct + \"%\") : \"no tasks\",\n      hasReminder: !!reminderText, reminderText,\n      days, calendarDays, categoryStats, statsWeeks,\n      modal: s.modal, isAdd: s.modal === \"add\", isEdit: s.modal === \"edit\",\n      closeModal: this.closeModal, stopProp: this.stopProp, saveTask: this.saveTask, deleteTask: this.deleteTask,\n      formTitle: form.title || \"\", formDescription: form.description || \"\", formPriority: form.priority || \"medium\",\n      formStatus: form.status || \"to-do\", formProject: form.project || \"—\", formDate: form.date || \"\",\n      formDue: form.due || \"\", formForPerson: form.forPerson || \"\",\n      setTitle: (e) => this.setFormField(\"title\", e.target.value),\n      setDescription: (e) => this.setFormField(\"description\", e.target.value),\n      setPriority: (e) => this.setFormField(\"priority\", e.target.value),\n      setStatus: (e) => this.setFormField(\"status\", e.target.value),\n      setProject: (e) => this.setFormField(\"project\", e.target.value),\n      setDate: (e) => this.setFormField(\"date\", e.target.value),\n      setDue: (e) => this.setFormField(\"due\", e.target.value),\n      setForPerson: (e) => this.setFormField(\"forPerson\", e.target.value),\n      onTitleKeyDown: (e) => { if (e.key === \"Enter\") this.saveTask(); },\n      onCommentKeyDown: (e) => { if (e.key === \"Enter\") this.addComment(); },\n      comments, newCommentText: s.newCommentText,\n      setNewCommentText: (e) => this.setNewCommentText(e.target.value),\n      addComment: this.addComment,\n      subtasks, subtaskTotal, subtaskDone, subtaskPct, hasSubtasks: subtaskTotal > 0,\n      newSubtaskText: s.newSubtaskText || \"\",\n      setNewSubtaskText: (e) => this.setNewSubtaskText(e.target.value),\n      addSubtask: this.addSub
